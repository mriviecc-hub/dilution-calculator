<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plot Grid</title>
<style>
:root{
  --bg:#f6f4ef; --surface:#ffffff; --surface-2:#efece5; --border:#dcd7cc; --text:#25221d; --muted:#6f685c;
  --accent:#8a5a2b; --accent-text:#fff; --danger:#b3261e; --shadow:0 1px 2px rgba(0,0,0,.08),0 2px 8px rgba(0,0,0,.06);
  --cell-w:220px; --cell-h:120px; --head-w:190px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1a18; --surface:#262421; --surface-2:#2f2c28; --border:#3e3a34; --text:#ece7de; --muted:#a59d90;
    --accent:#d39a5f; --accent-text:#1b1a18; --danger:#f2867d; --shadow:0 1px 2px rgba(0,0,0,.4),0 2px 8px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#1b1a18; --surface:#262421; --surface-2:#2f2c28; --border:#3e3a34; --text:#ece7de; --muted:#a59d90;
  --accent:#d39a5f; --accent-text:#1b1a18; --danger:#f2867d; --shadow:0 1px 2px rgba(0,0,0,.4),0 2px 8px rgba(0,0,0,.3);
}
:root.compact{--cell-w:160px; --cell-h:72px; --head-w:150px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:6px 10px}
button:hover{background:var(--surface-2)}
button.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
button.danger{color:var(--danger)}
button.icon{padding:2px 6px;border:none;background:transparent;color:var(--muted);border-radius:4px}
button.icon:hover{background:var(--surface-2);color:var(--text)}
input[type=text],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:6px 8px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

header.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--surface)}
.brand{font-weight:700;letter-spacing:.02em;margin-right:6px}
.toolbar .sep{width:1px;height:24px;background:var(--border)}
.toolbar .grow{flex:1}
#projectSelect{max-width:200px}
#search{width:170px}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);padding:4px;display:none;z-index:50;min-width:200px}
.menu-pop.open{display:block}
.menu-pop button{display:block;width:100%;text-align:left;border:none;background:transparent}
.menu-pop button:hover{background:var(--surface-2)}

main{flex:1;overflow:auto;position:relative}
.grid{display:grid;width:max-content;padding-bottom:40px}
.corner,.col-head,.row-head{background:var(--surface);position:sticky;z-index:2}
.corner{top:0;left:0;z-index:4;border-right:1px solid var(--border);border-bottom:1px solid var(--border);display:flex;align-items:flex-end;padding:8px;color:var(--muted);font-size:12px;width:var(--head-w)}
.col-head{top:0;border-bottom:1px solid var(--border);border-right:1px solid var(--border);padding:6px 6px 6px 10px;width:var(--cell-w);display:flex;flex-direction:column;gap:2px}
.row-head{left:0;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:8px 6px 8px 0;width:var(--head-w);height:var(--cell-h);display:flex;gap:6px;align-items:flex-start;z-index:3}
.row-head .stripe{width:5px;align-self:stretch;border-radius:0 3px 3px 0}
.head-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.head-actions{display:flex;gap:0;opacity:0;transition:opacity .1s}
.col-head:hover .head-actions,.row-head:hover .head-actions,.col-head:focus-within .head-actions,.row-head:focus-within .head-actions{opacity:1}
@media (hover:none){.head-actions{opacity:1}}
.editable{border:1px solid transparent;border-radius:4px;padding:1px 4px;margin-left:-4px;background:transparent;width:100%;min-width:0;font-weight:600}
.editable:hover{border-color:var(--border)}
.editable:focus{background:var(--surface-2)}
.sub{font-size:11px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.drag-handle{cursor:grab;color:var(--muted);user-select:none;font-size:12px;padding:0 2px}
.add-col,.add-row{color:var(--muted);border:1px dashed var(--border);background:transparent;border-radius:8px;margin:8px}
.add-col{position:sticky;top:0;z-index:2;width:120px;height:40px}
.add-row{position:sticky;left:0;width:calc(var(--head-w) - 16px);height:40px}

.cell{width:var(--cell-w);height:var(--cell-h);border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:6px;position:relative}
.cell.alt{background:color-mix(in srgb,var(--surface-2) 40%,transparent)}
.cell .add{position:absolute;inset:6px;border:1px dashed transparent;border-radius:8px;background:transparent;color:transparent;font-size:20px}
.cell:hover .add,.cell .add:focus{border-color:var(--border);color:var(--muted)}
@media (hover:none){.cell .add{color:var(--border)}}
.cell.drop-target{background:color-mix(in srgb,var(--accent) 15%,transparent)}
.card{height:100%;background:var(--surface);border-radius:8px;box-shadow:var(--shadow);border-left:5px solid var(--c,#999);padding:6px 8px;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;gap:2px;user-select:none}
.card:hover{outline:1px solid var(--border)}
.card.dragging{opacity:.4}
.card.dim{opacity:.25}
.card .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .n{color:var(--muted);font-size:12.5px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;white-space:pre-wrap}
:root.compact .card .n{-webkit-line-clamp:1}
.card .meta{margin-top:auto;display:flex;gap:4px;flex-wrap:wrap}
.badge{font-size:10.5px;padding:1px 6px;border-radius:99px;background:var(--surface-2);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.badge.s-draft{background:#f3e1b5;color:#6b4b00}
.badge.s-done{background:#cfe8cf;color:#1e5a1e}
.badge.s-revise{background:#f5cccc;color:#7a1d1d}
.col-head.drop-before,.row-head.drop-before{box-shadow:inset 3px 0 0 var(--accent)}
.row-head.drop-before{box-shadow:inset 0 3px 0 var(--accent)}

dialog{border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);padding:0;width:min(560px,calc(100vw - 32px));box-shadow:0 10px 40px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(0,0,0,.35)}
.dlg-head{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border)}
.dlg-head .crumb{font-size:12px;color:var(--muted);flex:1}
.dlg-body{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.dlg-body label{font-size:12px;color:var(--muted);font-weight:600;display:flex;flex-direction:column;gap:4px}
.dlg-body .row{display:flex;gap:10px;flex-wrap:wrap}
.dlg-body .row>label{flex:1;min-width:140px}
#cardTitle{font-size:17px;font-weight:600}
#cardNotes{min-height:180px;resize:vertical;line-height:1.5}
.dlg-foot{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border)}
.dlg-foot .grow{flex:1}
.hint{font-size:12px;color:var(--muted)}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:100}
.toast.show{opacity:1}
@media (max-width:640px){
  header.toolbar{padding:8px 16px}
  #search{width:120px}
  :root{--head-w:120px; --cell-w:180px}
  :root.compact{--head-w:110px; --cell-w:140px}
  .brand{display:none}
}
</style>
</head>
<body>
<header class="toolbar">
  <span class="brand">Plot Grid</span>
  <select id="projectSelect" aria-label="Project"></select>
  <button id="newProject" title="New project">New</button>
  <span class="sep"></span>
  <button id="undoBtn" title="Undo (Ctrl+Z)">↶</button>
  <button id="redoBtn" title="Redo (Ctrl+Shift+Z)">↷</button>
  <span class="grow"></span>
  <input type="search" id="search" placeholder="Filter cards…" aria-label="Filter cards">
  <select id="statusFilter" aria-label="Filter by status">
    <option value="">All statuses</option>
  </select>
  <div class="menu">
    <button id="menuBtn" aria-haspopup="true">⋯ More</button>
    <div class="menu-pop" id="menuPop">
      <button data-act="transpose">Swap axes (chapters as rows)</button>
      <button data-act="compact">Toggle compact cards</button>
      <button data-act="theme">Toggle light / dark</button>
      <hr style="border:none;border-top:1px solid var(--border)">
      <button data-act="renameProject">Rename project</button>
      <button data-act="exportMd">Export outline (Markdown)</button>
      <button data-act="exportCsv">Export grid (CSV)</button>
      <button data-act="exportJson">Export project (JSON)</button>
      <button data-act="importJson">Import project (JSON)…</button>
      <hr style="border:none;border-top:1px solid var(--border)">
      <button data-act="deleteProject" class="danger">Delete project</button>
    </div>
  </div>
</header>
<main id="main"><div class="grid" id="grid"></div></main>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<dialog id="cardDlg">
  <form method="dialog" id="cardForm">
    <div class="dlg-head">
      <span class="crumb" id="cardCrumb"></span>
      <button type="button" class="icon" id="cardClose" aria-label="Close">✕</button>
    </div>
    <div class="dlg-body">
      <input type="text" id="cardTitle" placeholder="Scene title" aria-label="Title" autocomplete="off">
      <textarea id="cardNotes" placeholder="What happens here? Beats, conflict, reveals…" aria-label="Notes"></textarea>
      <div class="row">
        <label>Status<select id="cardStatus"></select></label>
        <label>Tags<input type="text" id="cardTags" placeholder="pov:Ana, flashback" autocomplete="off"></label>
      </div>
      <div class="row">
        <label>Plotline<select id="cardRow"></select></label>
        <label>Chapter / beat<select id="cardCol"></select></label>
      </div>
      <span class="hint">Changes save automatically. Esc to close.</span>
    </div>
    <div class="dlg-foot">
      <button type="button" class="danger" id="cardDelete">Delete card</button>
      <span class="grow"></span>
      <button type="submit" class="primary">Done</button>
    </div>
  </form>
</dialog>
<div class="toast" id="toast"></div>

<script>
(() => {
'use strict';
const STORE_KEY = 'plotgrid.v1';
const STATUSES = [['idea','Idea'],['draft','Drafted'],['revise','Needs revision'],['done','Done']];
const PALETTE = ['#c0563f','#3f7cc0','#4f9a55','#b98a2a','#8a54b5','#2a9a96','#c04f86','#6b7280'];
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,10);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------- storage ----------
function load(){
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) return JSON.parse(raw); } catch(e){}
  return null;
}
function persist(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e){}
}
function sampleProject(){
  const cols = ['Opening','Inciting incident','First turn','Midpoint','Crisis','Climax','Resolution']
    .map((t,i)=>({id:uid(), title:t, sub: i<2?'Act I': i<5?'Act II':'Act III'}));
  const rows = [
    {id:uid(), title:'Main plot', color:PALETTE[0]},
    {id:uid(), title:'Romance', color:PALETTE[6]},
    {id:uid(), title:'Mystery', color:PALETTE[1]},
  ];
  const cards = {};
  const put = (r,c,title,notes,status='idea') => cards[rows[r].id+'|'+cols[c].id] = {id:uid(), title, notes, status, tags:''};
  put(0,0,'Ordinary world','Introduce the heroine at the lighthouse. Show what she wants and what she lacks.','draft');
  put(0,1,'The storm','A ship wrecks on the rocks — one survivor washes ashore.');
  put(1,1,'Meet the stranger','Survivor is evasive about who he is. Sparks and suspicion.');
  put(2,2,'The missing logbook','The ship’s log is gone. Someone took it before the rescue.');
  put(0,3,'False victory','She thinks she’s solved it — the town turns on the stranger.','revise');
  put(2,5,'Reveal','The logbook was hidden by her own father.');
  return {id:uid(), name:'Untitled novel', cols, rows, cards, transposed:false};
}
let state = load();
if (!state || !Array.isArray(state.projects) || !state.projects.length){
  const p = sampleProject();
  state = {projects:[p], current:p.id, compact:false, theme:''};
}
const proj = () => state.projects.find(p=>p.id===state.current) || state.projects[0];

// ---------- undo ----------
let undoStack = [], redoStack = [];
function snapshot(){ undoStack.push(JSON.stringify(proj())); if (undoStack.length>200) undoStack.shift(); redoStack = []; }
function restore(json){
  const p = JSON.parse(json); const i = state.projects.findIndex(x=>x.id===p.id);
  if (i>=0) state.projects[i] = p; else state.projects.push(p);
  state.current = p.id;
}
function undo(){ if(!undoStack.length) return toast('Nothing to undo'); redoStack.push(JSON.stringify(proj())); restore(undoStack.pop()); commit(false); }
function redo(){ if(!redoStack.length) return toast('Nothing to redo'); undoStack.push(JSON.stringify(proj())); restore(redoStack.pop()); commit(false); }
// mutate helper: snapshot, apply, save, render
function change(fn){ snapshot(); fn(proj()); commit(); }
function commit(){ persist(); render(); }

// ---------- rendering ----------
const grid = $('#grid');
function axes(p){
  // "lanes" go down the side, "steps" go across the top.
  return p.transposed ? {lanes:p.cols, steps:p.rows, laneKind:'col', stepKind:'row'}
                      : {lanes:p.rows, steps:p.cols, laneKind:'row', stepKind:'col'};
}
function keyFor(p, laneId, stepId){ return p.transposed ? stepId+'|'+laneId : laneId+'|'+stepId; }
function matches(card){
  const q = $('#search').value.trim().toLowerCase(), st = $('#statusFilter').value;
  if (st && card.status!==st) return false;
  if (!q) return true;
  return (card.title+' '+card.notes+' '+(card.tags||'')).toLowerCase().includes(q);
}

function render(){
  const p = proj();
  document.documentElement.classList.toggle('compact', !!state.compact);
  if (state.theme) document.documentElement.dataset.theme = state.theme; else delete document.documentElement.dataset.theme;
  document.title = p.name + ' — Plot Grid';
  // project select
  $('#projectSelect').innerHTML = state.projects.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${esc(x.name)}</option>`).join('');
  $('#undoBtn').disabled = !undoStack.length; $('#redoBtn').disabled = !redoStack.length;

  const {lanes, steps, laneKind, stepKind} = axes(p);
  grid.style.gridTemplateColumns = `var(--head-w) repeat(${steps.length}, var(--cell-w)) auto`;
  const rowColor = id => (p.rows.find(r=>r.id===id)||{}).color;
  let h = `<div class="corner">${p.transposed?'Chapters ↓ · Plotlines →':'Plotlines ↓ · Chapters →'}</div>`;
  steps.forEach((s,i)=> h += headHtml(s, stepKind, i, 'col-head'));
  h += `<button class="add-col" data-add="${stepKind}">+ ${stepKind==='col'?'Chapter':'Plotline'}</button>`;
  lanes.forEach((l,li)=>{
    h += headHtml(l, laneKind, li, 'row-head');
    steps.forEach((s,si)=>{
      const k = keyFor(p, l.id, s.id), c = p.cards[k];
      const color = rowColor(p.transposed ? s.id : l.id);
      h += `<div class="cell${li%2?' alt':''}" data-key="${k}">`;
      if (c){
        const tags = (c.tags||'').split(',').map(t=>t.trim()).filter(Boolean);
        const stLabel = (STATUSES.find(x=>x[0]===c.status)||STATUSES[0])[1];
        h += `<div class="card${matches(c)?'':' dim'}" draggable="true" tabindex="0" data-key="${k}" style="--c:${color}">
          <div class="t">${esc(c.title||'Untitled')}</div>
          ${c.notes?`<div class="n">${esc(c.notes)}</div>`:''}
          <div class="meta"><span class="badge s-${c.status}">${stLabel}</span>${tags.map(t=>`<span class="badge">${esc(t)}</span>`).join('')}</div>
        </div>`;
      } else {
        h += `<button class="add" data-new="${k}" aria-label="Add card">+</button>`;
      }
      h += `</div>`;
    });
    h += `<div></div>`;
  });
  h += `<button class="add-row" data-add="${laneKind}">+ ${laneKind==='row'?'Plotline':'Chapter'}</button>`;
  grid.innerHTML = h;
}
function headHtml(item, kind, idx, cls){
  const isRow = kind==='row';
  const stripe = isRow ? `<span class="stripe" style="background:${item.color}"></span>` : '';
  const sub = isRow ? '' : `<input class="sub editable" data-field="sub" value="${esc(item.sub||'')}" placeholder="Act / part" aria-label="Group">`;
  const colorBtn = isRow ? `<button class="icon" data-color="${item.id}" title="Change color">●</button>` : '';
  const topStripe = isRow && cls==='col-head' ? ` style="box-shadow:inset 0 4px 0 ${item.color}"` : '';
  return `<div class="${cls}" data-kind="${kind}" data-id="${item.id}"${topStripe}>
    ${cls==='row-head'?stripe:''}
    <div class="head-main">
      ${sub}
      <input class="editable" data-field="title" value="${esc(item.title)}" aria-label="${isRow?'Plotline':'Chapter'} name">
      <div class="head-actions">
        <span class="drag-handle" draggable="true" title="Drag to reorder">⠿</span>
        <button class="icon" data-move="-1" title="Move ${cls==='row-head'?'up':'left'}">${cls==='row-head'?'↑':'←'}</button>
        <button class="icon" data-move="1" title="Move ${cls==='row-head'?'down':'right'}">${cls==='row-head'?'↓':'→'}</button>
        <button class="icon" data-insert title="Insert after">＋</button>
        ${colorBtn}
        <button class="icon" data-del title="Delete">🗑</button>
      </div>
    </div>
  </div>`;
}

// ---------- grid interactions ----------
const listOf = (p,kind) => kind==='row' ? p.rows : p.cols;
function newItem(kind, p){
  return kind==='row'
    ? {id:uid(), title:'New plotline', color:PALETTE[p.rows.length % PALETTE.length]}
    : {id:uid(), title:'Chapter '+(p.cols.length+1), sub:''};
}
grid.addEventListener('click', e=>{
  const t = e.target;
  const head = t.closest('[data-kind]');
  if (t.closest('[data-add]')){
    const kind = t.closest('[data-add]').dataset.add;
    change(p=>listOf(p,kind).push(newItem(kind,p)));
    focusHead(listOf(proj(),kind).at(-1).id);
    return;
  }
  if (t.closest('[data-new]')){
    const k = t.closest('[data-new]').dataset.new;
    change(p=>p.cards[k] = {id:uid(), title:'', notes:'', status:'idea', tags:''});
    openCard(k); editIsNew = true; return;
  }
  if (head){
    const kind = head.dataset.kind, id = head.dataset.id, p = proj(), list = listOf(p,kind);
    const i = list.findIndex(x=>x.id===id);
    if (t.closest('[data-move]')){
      const j = i + Number(t.closest('[data-move]').dataset.move);
      if (j<0||j>=list.length) return;
      change(p=>{ const l=listOf(p,kind); [l[i],l[j]]=[l[j],l[i]]; });
    } else if (t.closest('[data-insert]')){
      change(p=>listOf(p,kind).splice(i+1,0,newItem(kind,p)));
      focusHead(listOf(proj(),kind)[i+1].id);
    } else if (t.closest('[data-del]')){
      const n = Object.keys(p.cards).filter(k=>k.split('|')[kind==='row'?0:1]===id).length;
      if (n && !confirm(`Delete "${list[i].title}" and its ${n} card${n>1?'s':''}?`)) return;
      change(p=>{
        listOf(p,kind).splice(i,1);
        for (const k of Object.keys(p.cards)) if (k.split('|')[kind==='row'?0:1]===id) delete p.cards[k];
      });
      toast('Deleted — Ctrl+Z to undo');
    } else if (t.closest('[data-color]')){
      const r = p.rows[i]; const next = PALETTE[(PALETTE.indexOf(r.color)+1) % PALETTE.length];
      change(p=>p.rows[i].color = next);
    }
    return;
  }
  const card = t.closest('.card');
  if (card) openCard(card.dataset.key);
});
grid.addEventListener('keydown', e=>{
  const card = e.target.closest('.card');
  if (card && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); openCard(card.dataset.key); }
  if (e.target.matches('.editable') && e.key==='Enter') e.target.blur();
  if (e.target.matches('.editable') && e.key==='Escape'){ e.target.value = e.target.defaultValue; e.target.blur(); }
});
grid.addEventListener('change', e=>{
  if (!e.target.matches('.editable')) return;
  const head = e.target.closest('[data-kind]'), field = e.target.dataset.field;
  const val = e.target.value.trim() || (field==='title' ? 'Untitled' : '');
  change(p=>{ const it = listOf(p,head.dataset.kind).find(x=>x.id===head.dataset.id); it[field]=val; });
});
function focusHead(id){
  const el = grid.querySelector(`[data-id="${id}"] input[data-field="title"]`);
  if (el){ el.focus(); el.select(); el.scrollIntoView({block:'nearest',inline:'nearest'}); }
}

// ---------- drag & drop ----------
let drag = null;
grid.addEventListener('dragstart', e=>{
  const card = e.target.closest('.card');
  const handle = e.target.closest('.drag-handle');
  if (card){ drag = {type:'card', key:card.dataset.key}; card.classList.add('dragging'); }
  else if (handle){ const h = handle.closest('[data-kind]'); drag = {type:'head', kind:h.dataset.kind, id:h.dataset.id}; e.dataTransfer.setDragImage(h, 10, 10); }
  else return;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', 'plotgrid');
});
grid.addEventListener('dragend', ()=>{ drag=null; clearDrop(); grid.querySelectorAll('.dragging').forEach(x=>x.classList.remove('dragging')); });
function clearDrop(){ grid.querySelectorAll('.drop-target,.drop-before').forEach(x=>x.classList.remove('drop-target','drop-before')); }
grid.addEventListener('dragover', e=>{
  if (!drag) return;
  if (drag.type==='card'){
    const cell = e.target.closest('.cell'); if (!cell) return;
    e.preventDefault(); clearDrop(); cell.classList.add('drop-target');
  } else {
    const h = e.target.closest('[data-kind]'); if (!h || h.dataset.kind!==drag.kind) return;
    e.preventDefault(); clearDrop(); h.classList.add('drop-before');
  }
});
grid.addEventListener('drop', e=>{
  if (!drag) return; e.preventDefault();
  if (drag.type==='card'){
    const cell = e.target.closest('.cell'); const to = cell && cell.dataset.key, from = drag.key;
    if (to && to!==from) change(p=>{ const a=p.cards[from], b=p.cards[to]; p.cards[to]=a; if (b) p.cards[from]=b; else delete p.cards[from]; });
  } else {
    const h = e.target.closest('[data-kind]');
    if (h && h.dataset.id!==drag.id){
      const {kind,id} = drag;
      change(p=>{ const l=listOf(p,kind); const it=l.splice(l.findIndex(x=>x.id===id),1)[0]; l.splice(l.findIndex(x=>x.id===h.dataset.id),0,it); });
    }
  }
  drag=null; clearDrop();
});

// ---------- card editor ----------
const dlg = $('#cardDlg');
let editKey = null, editSnapTaken = false, editIsNew = false;
$('#cardStatus').innerHTML = STATUSES.map(([v,l])=>`<option value="${v}">${l}</option>`).join('');
$('#statusFilter').innerHTML += STATUSES.map(([v,l])=>`<option value="${v}">${l}</option>`).join('');
function openCard(k){
  const p = proj(), c = p.cards[k]; if (!c) return;
  editKey = k; editSnapTaken = false; editIsNew = false;
  const [rid, cid] = k.split('|');
  const r = p.rows.find(x=>x.id===rid), col = p.cols.find(x=>x.id===cid);
  $('#cardCrumb').innerHTML = `<span style="color:${r.color}">●</span> ${esc(r.title)} · ${col.sub?esc(col.sub)+' · ':''}${esc(col.title)}`;
  $('#cardTitle').value = c.title; $('#cardNotes').value = c.notes; $('#cardStatus').value = c.status; $('#cardTags').value = c.tags||'';
  $('#cardRow').innerHTML = p.rows.map(x=>`<option value="${x.id}" ${x.id===rid?'selected':''}>${esc(x.title)}</option>`).join('');
  $('#cardCol').innerHTML = p.cols.map(x=>`<option value="${x.id}" ${x.id===cid?'selected':''}>${esc((x.sub?x.sub+' · ':'')+x.title)}</option>`).join('');
  if (!dlg.open) dlg.showModal();
  if (!c.title) $('#cardTitle').focus();
}
function editField(field, val){
  const p = proj(); if (!editKey || !p.cards[editKey]) return;
  if (!editSnapTaken){ snapshot(); editSnapTaken = true; }  // one undo step per editing session
  p.cards[editKey][field] = val; commit();
}
$('#cardTitle').addEventListener('input', e=>editField('title', e.target.value));
$('#cardNotes').addEventListener('input', e=>editField('notes', e.target.value));
$('#cardTags').addEventListener('input', e=>editField('tags', e.target.value));
$('#cardStatus').addEventListener('change', e=>editField('status', e.target.value));
function moveCard(){
  const to = $('#cardRow').value+'|'+$('#cardCol').value, from = editKey;
  if (to===from) return;
  const p = proj();
  if (p.cards[to] && !confirm('That cell already has a card. Swap them?')){ openCard(from); return; }
  change(p=>{ const a=p.cards[from], b=p.cards[to]; p.cards[to]=a; if (b) p.cards[from]=b; else delete p.cards[from]; });
  openCard(to);
}
$('#cardRow').addEventListener('change', moveCard);
$('#cardCol').addEventListener('change', moveCard);
$('#cardDelete').addEventListener('click', ()=>{
  const k = editKey; dlg.close();
  change(p=>delete p.cards[k]); toast('Card deleted — Ctrl+Z to undo');
});
$('#cardClose').addEventListener('click', ()=>dlg.close());
dlg.addEventListener('click', e=>{ if (e.target===dlg) dlg.close(); });
dlg.addEventListener('close', ()=>{
  // discard cards that were opened but left completely empty
  const p = proj(), c = editKey && p.cards[editKey];
  if (c && !c.title.trim() && !c.notes.trim() && !(c.tags||'').trim()){
    delete p.cards[editKey];
    if (editIsNew){ undoStack.pop(); if (editSnapTaken) undoStack.pop(); } // creating + abandoning leaves no undo step
    commit();
  }
  const k = editKey; editKey = null;
  const el = k && grid.querySelector(`.card[data-key="${k}"]`); if (el) el.focus();
});

// ---------- toolbar ----------
$('#projectSelect').addEventListener('change', e=>{ state.current = e.target.value; undoStack=[]; redoStack=[]; commit(); });
$('#newProject').addEventListener('click', ()=>{
  const name = prompt('Project name', 'New project'); if (name===null) return;
  const p = {id:uid(), name:name.trim()||'New project', transposed:false, cards:{},
    rows:[{id:uid(), title:'Main plot', color:PALETTE[0]},{id:uid(), title:'Subplot', color:PALETTE[1]}],
    cols:[1,2,3,4,5].map(n=>({id:uid(), title:'Chapter '+n, sub:''}))};
  state.projects.push(p); state.current = p.id; undoStack=[]; redoStack=[]; commit();
});
$('#undoBtn').addEventListener('click', undo);
$('#redoBtn').addEventListener('click', redo);
$('#search').addEventListener('input', render);
$('#statusFilter').addEventListener('change', render);
const pop = $('#menuPop');
$('#menuBtn').addEventListener('click', e=>{ e.stopPropagation(); pop.classList.toggle('open'); });
document.addEventListener('click', e=>{ if (!e.target.closest('.menu')) pop.classList.remove('open'); });
pop.addEventListener('click', e=>{
  const act = e.target.dataset.act; if (!act) return; pop.classList.remove('open');
  const p = proj();
  if (act==='transpose') change(p=>p.transposed=!p.transposed);
  if (act==='compact'){ state.compact=!state.compact; commit(); }
  if (act==='theme'){
    const dark = state.theme ? state.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    state.theme = dark ? 'light' : 'dark'; commit();
  }
  if (act==='renameProject'){ const n = prompt('Rename project', p.name); if (n && n.trim()) change(p=>p.name=n.trim()); }
  if (act==='deleteProject'){
    if (!confirm(`Delete project "${p.name}"? This cannot be undone.`)) return;
    state.projects = state.projects.filter(x=>x.id!==p.id);
    if (!state.projects.length) state.projects.push(sampleProject());
    state.current = state.projects[0].id; undoStack=[]; redoStack=[]; commit();
  }
  if (act==='exportJson') download(slug(p.name)+'.plotgrid.json', JSON.stringify(p,null,2), 'application/json');
  if (act==='exportMd') download(slug(p.name)+'-outline.md', toMarkdown(p), 'text/markdown');
  if (act==='exportCsv') download(slug(p.name)+'-grid.csv', toCsv(p), 'text/csv');
  if (act==='importJson') $('#importFile').click();
});
$('#importFile').addEventListener('change', async e=>{
  const f = e.target.files[0]; e.target.value=''; if (!f) return;
  try {
    const p = JSON.parse(await f.text());
    if (!Array.isArray(p.rows)||!Array.isArray(p.cols)||typeof p.cards!=='object') throw new Error('bad');
    p.id = uid(); p.name = p.name || f.name.replace(/\..*$/,'');
    state.projects.push(p); state.current = p.id; undoStack=[]; redoStack=[]; commit(); toast('Imported "'+p.name+'"');
  } catch(err){ alert('That file is not a Plot Grid project.'); }
});
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'project';
function download(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text],{type})); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
function toMarkdown(p){
  let out = `# ${p.name}\n`, group = null;
  for (const c of p.cols){
    if (c.sub && c.sub!==group){ group = c.sub; out += `\n## ${c.sub}\n`; }
    out += `\n### ${c.title}\n`;
    for (const r of p.rows){
      const card = p.cards[r.id+'|'+c.id]; if (!card) continue;
      out += `\n- **${r.title}: ${card.title||'Untitled'}**` + (card.status!=='idea'?` _(${(STATUSES.find(s=>s[0]===card.status)||[])[1]})_`:'') + '\n';
      if (card.notes) out += card.notes.split('\n').map(l=>'  '+l).join('\n') + '\n';
    }
  }
  return out;
}
function toCsv(p){
  const q = v => '"'+String(v).replace(/"/g,'""')+'"';
  const lines = [['Plotline', ...p.cols.map(c=>(c.sub?c.sub+' — ':'')+c.title)].map(q).join(',')];
  for (const r of p.rows) lines.push([r.title, ...p.cols.map(c=>{ const k=p.cards[r.id+'|'+c.id]; return k ? (k.title + (k.notes?'\n'+k.notes:'')) : ''; })].map(q).join(','));
  return lines.join('\n');
}

let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }

document.addEventListener('keydown', e=>{
  const typing = e.target.matches('input,textarea,select');
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z' && !typing){ e.preventDefault(); e.shiftKey?redo():undo(); }
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='y' && !typing){ e.preventDefault(); redo(); }
  if (e.key==='/' && !typing){ e.preventDefault(); $('#search').focus(); }
});

render();
})();
</script>
</body>
</html>
